<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LEDGER">
<link rel="manifest" href="manifest.json">
<title>LEDGER — The Private Ledger</title>
<style>
/* Self-hosted JetBrains Mono (latin variable, weights 400–700) — no network. */
@font-face{
  font-family:'JetBrains Mono';
  font-style:normal;
  font-weight:400 700;
  font-display:swap;
  src:url('jetbrains-mono-latin.woff2') format('woff2');
}
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#0A0A0A; --ink-2:#444444; --ink-3:#8A8A8A;
  --line:#0A0A0A; --line-soft:#D6D6D6; --soft:#D6D6D6; --hover:#F2F2F2; --code:#F6F6F6;
  --invert-bg:#0A0A0A; --invert-ink:#FFFFFF;
}
[data-theme="dark"]{
  --bg:#000000; --paper:#0C0C0C; --ink:#F5F5F5; --ink-2:#BDBDBD; --ink-3:#777777;
  --line:#F5F5F5; --line-soft:#2A2A2A; --soft:#2A2A2A; --hover:#161616; --code:#141414;
  --invert-bg:#F5F5F5; --invert-ink:#0A0A0A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:13px;line-height:1.5;
  padding:26px 16px 60px;transition:background .25s,color .25s;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.receipt{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line-soft);position:relative}
.perf{height:12px;display:block;width:100%}
.perf svg{display:block;width:100%;height:12px}
.pad{padding:22px 30px 30px}

.head{text-align:center}
.logo{font-weight:700;font-size:22px;letter-spacing:.42em;text-indent:.42em}
.logo-sub{font-size:9.5px;letter-spacing:.34em;color:var(--ink-3);margin-top:7px}
.meta{font-size:10px;color:var(--ink-2);margin-top:14px;letter-spacing:.04em;line-height:1.9}
.meta b{color:var(--ink);font-weight:500}

.rule{border:0;border-top:1px solid var(--line);margin:16px 0}
.rule.dash{border-top:1px dashed var(--line-soft)}
.rule.dbl{border:0;height:3px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;max-width:560px;margin-left:auto;margin-right:auto}
.toolbar .stamp{font-size:9px;letter-spacing:.18em;color:var(--ink-3)}
.toggle{font-family:inherit;font-size:9.5px;letter-spacing:.14em;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;cursor:pointer;transition:all .15s}
.toggle:hover{background:var(--invert-bg);color:var(--invert-ink)}

.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;scroll-snap-align:center;font-family:inherit;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--ink-2);border:0;border-right:1px solid var(--line-soft);padding:11px 13px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tabs button:hover{background:var(--hover);color:var(--ink)}
.tabs button.on{background:var(--invert-bg);color:var(--invert-ink)}
.tabs:not(.x) button[data-v]:not(.pri){display:none}
.tabs button.more{color:var(--ink-3)}

.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.section-title{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin:18px 0 12px}
.section-title:first-child{margin-top:4px}
.li{display:flex;align-items:baseline;gap:6px;padding:5px 0}
.li .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.li .k small{display:block;color:var(--ink-3);font-size:10px;letter-spacing:0}
.li .dots{flex:1;border-bottom:1px dotted var(--line-soft);transform:translateY(-3px);min-width:12px}
.li .v{white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.li.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700}
.li.big .v{font-size:15px;font-weight:700}
.li.tap{cursor:pointer}
.li.tap:hover{background:var(--hover)}
.pos{color:var(--ink)}
.neg::before{content:"−"}
.muted{color:var(--ink-3)}

.hero-total{text-align:center;padding:8px 0 4px}
.hero-total .lbl{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.hero-total .amt{font-size:38px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.hero-total .sub{font-size:10.5px;color:var(--ink-2);margin-top:6px;letter-spacing:.02em}

.split{display:flex;border:1px solid var(--line-soft);margin:14px 0}
.split>div{flex:1;text-align:center;padding:12px 6px;border-right:1px solid var(--line-soft)}
.split>div:last-child{border-right:0}
.split .l{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.split .n{font-size:14px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}

.barline{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.barline .bk{width:124px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barline .bar{flex:1;color:var(--ink);letter-spacing:-1px;overflow:hidden;white-space:nowrap}
.barline .bv{width:70px;text-align:right;font-variant-numeric:tabular-nums}

.tag{display:inline-block;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-soft);padding:1px 6px;color:var(--ink-2)}
.tag.k{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}

.prog{margin:12px 0}
.prog .ph{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.prog .track{font-size:11px;letter-spacing:-1px;color:var(--ink);overflow:hidden;white-space:nowrap}
.prog .pm{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-3);margin-top:4px;letter-spacing:.04em}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;justify-content:center}
.chips button{font-family:inherit;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-soft);background:var(--bg);color:var(--ink-2);padding:5px 9px;cursor:pointer}
.chips button.on{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}

.alerts{border:1px solid var(--line);margin-bottom:18px}
.alerts .ah{display:flex;justify-content:space-between;align-items:center;background:var(--invert-bg);color:var(--invert-ink);padding:7px 12px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.alerts .ai{display:flex;align-items:baseline;gap:8px;padding:8px 12px;font-size:11px;border-bottom:1px dashed var(--line-soft)}
.alerts .ai:last-child{border-bottom:0}
.alerts .ai .when{margin-left:auto;color:var(--ink-3);font-size:9.5px;white-space:nowrap}

.chart{margin:10px 0 8px;color:var(--ink)}
.chart svg{display:block;width:100%;height:auto}

.reg-form{border:1px solid var(--line);padding:14px;margin-bottom:16px}
.io{display:flex;margin-bottom:12px;border:1px solid var(--line)}
.io button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--bg);color:var(--ink-2);border:0;padding:9px;cursor:pointer}
.io button.on{background:var(--invert-bg);color:var(--invert-ink)}
.io button:first-child{border-right:1px solid var(--line)}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fld label{width:90px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select{flex:1;font-family:inherit;font-size:12px;background:var(--bg);color:var(--ink);border:0;border-bottom:1px dotted var(--line-soft);padding:6px 2px;outline:none}
.fld input:focus,.fld select:focus{border-bottom:1px solid var(--ink)}
.fld.chk{justify-content:flex-start}
.fld.chk input{flex:0}
.add{width:100%;font-family:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--invert-bg);color:var(--invert-ink);border:1px solid var(--line);padding:12px;cursor:pointer;margin-top:8px}
.add:hover{opacity:.85}
.add.ghost{background:var(--bg);color:var(--ink-2)}
.flash{animation:flash .6s ease}
@keyframes flash{0%{background:var(--hover)}100%{background:transparent}}

.xp-panel{border:1px solid var(--line);padding:14px;margin-bottom:14px}
.xp-row{margin-bottom:12px}
.xp-row:last-child{margin-bottom:0}
.xp-lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.xp-chips{display:flex;flex-wrap:wrap;gap:6px}
.xp-chips button{font-family:inherit;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--soft);background:var(--bg);color:var(--ink-2);padding:6px 10px;cursor:pointer}
.xp-chips button.on{background:var(--invert-bg);color:var(--invert-ink);border-color:var(--invert-bg)}
.xp-result-head{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);border-bottom:3px double var(--line);padding:12px 0;margin-top:4px}
.xp-result-head .xr-amt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.xp-result-head .xr-cnt{font-size:10px;color:var(--ink-3);letter-spacing:.08em}
.xp-grow{display:grid;grid-template-columns:108px 1fr 78px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);color:var(--ink)}
.xp-grow:last-child{border-bottom:none}
.xp-grow .gl{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-grow .gl small{display:block;font-weight:400;color:var(--ink-3);font-size:9px}
.xp-grow .gbar{height:8px;background:var(--bg);position:relative;overflow:hidden;border:1px solid var(--soft)}
.xp-grow .gbar i{position:absolute;inset:0 auto 0 0;background:currentColor;display:block}
.xp-grow .gv{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.xp-empty{text-align:center;font-size:10px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;padding:24px 0}

.imp-drop{border:2px dashed var(--soft);padding:28px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;color:var(--ink)}
.imp-drop:hover,.imp-drop.drag{border-color:var(--ink);background:var(--code)}
.imp-drop .ic{font-size:26px;line-height:1;margin-bottom:10px}
.imp-drop .it{font-size:12px;font-weight:600;margin-bottom:4px}
.imp-drop .is{font-size:10px;color:var(--ink-3)}
.imp-summary{display:flex;border:1px solid var(--line);margin:14px 0}
.imp-summary>div{flex:1;text-align:center;padding:12px 6px;border-right:1px solid var(--soft)}
.imp-summary>div:last-child{border-right:none}
.imp-summary .l{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.imp-summary .n{font-size:16px;font-weight:500;margin-top:5px}

.rv-q{border:1px solid var(--soft);padding:12px 14px;margin-bottom:10px;color:var(--ink)}
.rv-q .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.rv-q .qm{font-size:13px;font-weight:600}
.rv-q .qm small{display:block;font-size:10px;color:var(--ink-3);font-weight:400}
.rv-q .qa{font-size:14px;font-weight:700}
.rv-cats{display:flex;flex-wrap:wrap;gap:6px}
.rv-cats button{font-family:inherit;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--soft);background:var(--bg);color:var(--ink-2);padding:6px 10px;cursor:pointer}
.rv-cats button:hover{border-color:var(--ink);color:var(--ink)}
.rv-recap{border:1px dashed var(--ink-3);padding:11px 13px;margin-bottom:12px;color:var(--ink)}
.rv-recap .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.rv-recap .qm{font-size:12px;font-weight:700}
.rv-recap .rv-x{font-family:inherit;font-size:9px;letter-spacing:.05em;text-transform:uppercase;border:none;background:none;color:var(--ink-3);cursor:pointer;padding:0}
.rv-recap .rv-x:hover{color:var(--ink)}
.rv-recap .li{display:flex;align-items:baseline;font-size:11px;padding:2px 0;color:var(--ink-2)}
.rv-recap .li .v{font-weight:600;color:var(--ink)}
.rv-done{text-align:center;padding:30px 16px;color:var(--ink)}
.rv-done .ck{font-size:34px;margin-bottom:10px}
.rv-done .dt{font-size:14px;font-weight:600;margin-bottom:6px}
.rv-done .ds{font-size:11px;color:var(--ink-3)}

.actions{display:flex;gap:10px;margin:18px 0 6px}
.actions button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:var(--invert-bg);color:var(--invert-ink);padding:13px;cursor:pointer}
.actions button.ghost{background:var(--bg);color:var(--ink)}
.foot-note{text-align:center;font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);margin-top:18px;line-height:1.9}

/* modal editor */
.modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.md-card{background:var(--paper);border:1px solid var(--line);max-width:380px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.md-h{font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin-bottom:16px}
.md-actions{display:flex;gap:8px;margin-top:16px}
.md-actions button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--invert-bg);color:var(--invert-ink);border:1px solid var(--line);padding:11px;cursor:pointer}
.md-actions button.ghost{background:var(--bg);color:var(--ink)}

/* lock screen */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .lk-inner{width:100%;max-width:360px;text-align:center}
#lock .lk-mark{font-weight:700;font-size:30px;letter-spacing:.42em;text-indent:.42em;margin-bottom:6px}
#lock .lk-sub{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3);margin-bottom:34px}
#lock .lk-field{border:1px solid var(--line);display:flex;align-items:center;padding:0 0 0 14px;margin-bottom:12px}
#lock .lk-field span{font-size:9px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
#lock input{flex:1;font-family:inherit;font-size:14px;background:transparent;color:var(--ink);border:0;padding:14px 12px;outline:none;letter-spacing:.1em}
#lock .lk-btn{width:100%;font-family:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:var(--invert-bg);color:var(--invert-ink);border:1px solid var(--line);padding:15px;cursor:pointer}
#lock .lk-msg{font-size:10px;margin-top:14px;min-height:14px;color:var(--ink-3)}
#lock .lk-foot{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:30px;line-height:1.9}
#lock .lk-hint{font-size:9px;color:var(--ink-3);margin-top:6px}
.locked-body{overflow:hidden;height:100vh}
.toolbar .tools{display:flex;gap:8px;flex-shrink:0}

@media print{
  body{background:#fff;padding:0}
  .no-print{display:none!important}
  .receipt{border:none;max-width:none}
  .view:not(.on){display:none}
  @page{margin:14mm}
}
@media (max-width:520px){
  .pad{padding:20px 18px 26px}
  .li .k{max-width:54%}
  .hero-total .amt{font-size:30px}
  .fld label{width:80px}
  /* iOS zooms in on any input <16px and never zooms back — keep fields at 16px */
  input,select,textarea,#lock input,.fld input,.fld select{font-size:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.view.on{animation:none}}
</style>
</head>

<script>
/* =====================================================================
   LEDGER · client-side end-to-end encryption (Web Crypto only)
   ===================================================================== */
const ENC = new TextEncoder();
const DEC = new TextDecoder();
const KDF_ITERATIONS = 600000;
const ENVELOPE_VERSION = 1;
const b64 = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0)),
};
async function deriveKey(passphrase, salt) {
  const baseKey = await crypto.subtle.importKey('raw', ENC.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: KDF_ITERATIONS, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function newVaultSalt(){ return crypto.getRandomValues(new Uint8Array(16)); }
async function encrypt(plainObject, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = ENC.encode(JSON.stringify(plainObject));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  return { v: ENVELOPE_VERSION, alg: 'AES-256-GCM', iv: b64.enc(iv), ct: b64.enc(ct), ts: new Date().toISOString() };
}
async function decrypt(envelope, key) {
  const iv = b64.dec(envelope.iv), ct = b64.dec(envelope.ct);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(DEC.decode(plain));
}
async function registerSecurityKey(userId, userName) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.create({ publicKey: {
    challenge, rp: { name: 'LEDGER' },
    user: { id: ENC.encode(userId), name: userName, displayName: userName },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'cross-platform', userVerification: 'required', residentKey: 'required' },
    extensions: { hmacCreateSecret: true }, timeout: 60000 } });
}
async function assertSecurityKey(credentialId, hmacSalt) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.get({ publicKey: {
    challenge, allowCredentials: credentialId ? [{ type: 'public-key', id: credentialId }] : [],
    userVerification: 'required',
    extensions: hmacSalt ? { hmacGetSecret: { salt1: hmacSalt } } : undefined, timeout: 60000 } });
}
function generateRecoveryKey() {
  const bytes = crypto.getRandomValues(new Uint8Array(20));
  return [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase().match(/.{1,4}/g).join('-');
}
const LedgerCrypto = { deriveKey, newVaultSalt, encrypt, decrypt, registerSecurityKey, assertSecurityKey, generateRecoveryKey, b64 };

/* ---------- IndexedDB: stores ONLY ciphertext ---------- */
const DB_NAME='ledger-vault', STORE='vault';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore(STORE); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(key){ const db=await idb(); return new Promise((res,rej)=>{
  const t=db.transaction(STORE,'readonly').objectStore(STORE).get(key);
  t.onsuccess=()=>res(t.result??null); t.onerror=()=>rej(t.error); }); }
async function idbSet(key,val){ const db=await idb(); return new Promise((res,rej)=>{
  const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(val,key);
  t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error); }); }

/* =====================================================================
   App state + model
   ===================================================================== */
let VAULT_KEY=null, VAULT=null, activeTab='overview';
const MODEL_VERSION=2;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const num=x=>{ const n=parseFloat(x); return isNaN(n)?0:n; };
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{ if(!d) return ''; const x=new Date(d); return isNaN(x)?d:x.toLocaleDateString('en-US',{month:'short',day:'2-digit'}).toUpperCase(); };
/* Normalize any date string to ISO YYYY-MM-DD (handles MM/DD/YYYY, M/D/YY, etc.)
   so all month math is consistent. Avoids UTC shift by reading local parts. */
function isoDate(s){
  if(!s) return todayStr();
  s=String(s).trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){ let y=m[3]; if(y.length===2) y='20'+y; return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'); }
  const d=new Date(s); return isNaN(d)?todayStr():d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const ACCT_TYPES=['Checking','Savings','Cash','Brokerage','Retirement','Crypto','Property','Vehicle','Credit Card','Loan','Mortgage','Line of Credit','Other'];
const LIAB_TYPES=['Credit Card','Loan','Mortgage','Line of Credit'];

const ASSET_CLASSES=['US Equity','International','Bonds','Cash','Crypto','Other'];

const CATS=['Income','Food','Equipment','Travel','Software','Marketing','Insurance','Health','Auto','Meals 50%','Housing','Utilities','Owner Draw','Consulting','Other'];

function blankVault(){
  return { version:MODEL_VERSION, createdAt:new Date().toISOString(),
    transactions:[], accounts:[], holdings:[], recurring:[], goals:[], mileage:[], docs:[], snapshots:[],
    settings:{ merchantRules:{}, profile:{name:''}, tax:{effectiveRate:25, stateRate:0}, reviewCleared:0 } };
}
function migrateVault(v){
  v=v||{}; v.version=MODEL_VERSION;
  ['transactions','accounts','holdings','recurring','goals','mileage','docs','snapshots'].forEach(k=>{ if(!Array.isArray(v[k])) v[k]=[]; });
  v.settings=v.settings||{};
  v.settings.merchantRules=v.settings.merchantRules||{};
  v.settings.profile=v.settings.profile||{name:''};
  v.settings.tax=v.settings.tax||{effectiveRate:25, stateRate:0};
  if(typeof v.settings.reviewCleared!=='number') v.settings.reviewCleared=0;
  // repair any non-ISO dates from earlier imports so month math is correct
  v.transactions.forEach(t=>{ if(t.date && !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) t.date=isoDate(t.date); });
  return v;
}
const coll=k=>(VAULT&&Array.isArray(VAULT[k]))?VAULT[k]:[];
const settings=()=>{ if(VAULT&&!VAULT.settings)VAULT.settings={}; return VAULT?VAULT.settings:{}; };

async function saveVault(){ if(!VAULT_KEY||!VAULT) return; await idbSet('data', await LedgerCrypto.encrypt(VAULT,VAULT_KEY)); }
function captureSnapshot(){
  if(!VAULT) return;
  const d=todayStr(), nw=netWorth();
  const s=VAULT.snapshots, last=s[s.length-1];
  if(last&&last.date===d) last.netWorth=nw; else s.push({date:d,netWorth:nw});
  if(s.length>180) VAULT.snapshots=s.slice(-180);
}
async function persist(){ captureSnapshot(); await saveVault(); renderActive(); }

/* =====================================================================
   Derived numbers (never stored)
   ===================================================================== */
const isLiab=a=>a.kind==='liability'||LIAB_TYPES.includes(a.type);
const holdingsValue=()=>coll('holdings').reduce((s,h)=>s+num(h.value),0);
const holdingsCost=()=>coll('holdings').reduce((s,h)=>s+num(h.costBasis),0);
const assetsTotal=()=>coll('accounts').filter(a=>!isLiab(a)).reduce((s,a)=>s+num(a.balance),0)+holdingsValue();
const liabTotal=()=>coll('accounts').filter(isLiab).reduce((s,a)=>s+num(a.balance),0);
const netWorth=()=>assetsTotal()-liabTotal();
const liquidTotal=()=>coll('accounts').filter(a=>LIQUID_TYPES.includes(a.type)).reduce((s,a)=>s+num(a.balance),0);
const txSorted=()=>coll('transactions').slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const uncategorized=()=>coll('transactions').filter(t=>!t.category);
const ym=d=>(d||'').slice(0,7);
function flowFor(filterFn){ let inc=0,exp=0; coll('transactions').forEach(t=>{ if(filterFn&&!filterFn(t))return; if(t.direction==='in')inc+=num(t.amount); else exp+=num(t.amount); }); return {inc,exp,net:inc-exp}; }
function catTotals(filterFn){ const m={}; coll('transactions').forEach(t=>{ if(filterFn&&!filterFn(t))return; const k=t.category||'Uncategorized'; m[k]=(m[k]||0)+num(t.amount); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
const thisMonth=()=>todayStr().slice(0,7);
const deductibleYTD=()=>coll('transactions').filter(t=>t.deductible&&t.direction!=='in').reduce((s,t)=>s+num(t.amount),0);
const businessFlow=()=>flowFor(t=>t.type==='biz');
function monthlyInterest(){ return coll('accounts').filter(isLiab).reduce((s,a)=>s+num(a.balance)*num(a.apr)/100/12,0); }

const LABELS={accounts:'Account',holdings:'Holding',recurring:'Recurring',goals:'Goal',mileage:'Trip',docs:'Document',transactions:'Transaction'};
const modal=$('#modal');
let editTarget=null;
function fieldInput(f,val){
  if(f.type==='select') return `<div class="fld"><label>${f.label}</label><select data-k="${f.key}">`+
    f.options.map(o=>`<option${String(val)===String(o)?' selected':''}>${esc(o)}</option>`).join('')+`</select></div>`;
  if(f.type==='check') return `<div class="fld chk"><label>${f.label}</label><input data-k="${f.key}" type="checkbox"${val?' checked':''}></div>`;
  const t=f.type==='number'?'number':(f.type==='date'?'date':'text');
  const step=f.type==='number'?' step="0.01"':'';
  return `<div class="fld"><label>${f.label}</label><input data-k="${f.key}" type="${t}"${step} value="${esc(val==null?'':val)}"></div>`;
}
function openEditor(collKey, item){
  const fields=FIELDS[collKey]; if(!fields||!VAULT) return;
  editTarget={collKey,id:item?item.id:null};
  const data=item||defaultsFor(collKey), isNew=!item;
  modal.innerHTML=`<div class="md-card"><div class="md-h">${isNew?'Add':'Edit'} ${LABELS[collKey]||''}</div>`+
    fields.map(f=>fieldInput(f,data[f.key])).join('')+
    `<div class="md-actions">`+(isNew?'':'<button class="ghost" data-mdel>Delete</button>')+
    `<button class="ghost" data-mcancel>Cancel</button><button data-msave>Save</button></div></div>`;
  modal.classList.add('on');
}
function defaultsFor(c){
  if(c==='transactions') return {date:todayStr(),direction:'out',type:'per'};
  if(c==='mileage') return {date:todayStr(),rate:0.67};
  if(c==='recurring') return {cadence:'Monthly',kind:'Subscription',nextDate:todayStr()};
  return {};
}
function closeModal(){ modal.classList.remove('on'); modal.innerHTML=''; editTarget=null; }
async function saveEditor(){
  if(!editTarget) return;
  const {collKey,id}=editTarget, fields=FIELDS[collKey];
  const obj=id?{...VAULT[collKey].find(x=>x.id===id)}:{id:uid()};
  fields.forEach(f=>{ const el=modal.querySelector('[data-k="'+f.key+'"]'); if(!el) return;
    obj[f.key]= f.type==='check'?el.checked : f.type==='number'?num(el.value): el.value; });
  if(collKey==='accounts') obj.kind=LIAB_TYPES.includes(obj.type)?'liability':'asset';
  if(id){ VAULT[collKey][VAULT[collKey].findIndex(x=>x.id===id)]=obj; } else VAULT[collKey].push(obj);
  closeModal(); await persist();
}
async function deleteEditor(){
  if(!editTarget||!editTarget.id) return;
  if(!confirm('Delete this '+(LABELS[editTarget.collKey]||'item').toLowerCase()+'? This cannot be undone.')) return;
  VAULT[editTarget.collKey]=VAULT[editTarget.collKey].filter(x=>x.id!==editTarget.id);
  closeModal(); await persist();
}

/* row + helper builders */
function row(it,collKey,name,sub,val,cls){ return `<div class="li tap" data-edit="${collKey}:${it.id}"><span class="k">${esc(name)}${sub?` <small>${esc(sub)}</small>`:''}</span><span class="dots"></span><span class="v ${cls||''}">${val}</span></div>`; }
function empty(msg){ return `<div class="xp-empty">${esc(msg)}</div>`; }
function addBtn(collKey,label){ return `<button class="add no-print" data-add="${collKey}">+ ${esc(label||('Add '+(LABELS[collKey]||'')))}</button>`; }
function bars(entries){ const max=Math.max(1,...entries.map(e=>Math.abs(e[1]))); return entries.map(([l,v])=>`<div class="barline"><span class="bk">${esc(l)}</span><span class="bar">${'█'.repeat(Math.max(1,Math.round(Math.abs(v)/max*22)))}</span><span class="bv">${money0(v)}</span></div>`).join(''); }
function sparkline(vals){ if(vals.length<2) return ''; const w=300,h=64,mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-mn)/rng)*h).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>`; }

  const learned=settings().merchantRules; if(learned){ const k=(desc||'').toLowerCase(); for(const m in learned){ if(m&&k.includes(m)) return learned[m]; } }
  for(const [re,info] of CAT_RULES){ if(re.test(desc||'')) return info; }
  return null;
}

/* ---- Import ---- */
let impRows=[], lastImport=null;
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const delim=lines[0].includes('\t')?'\t':','; const header=lines[0].toLowerCase().split(delim).map(x=>x.replace(/"/g,'').trim());
  const di=header.findIndex(h=>/date/.test(h)), ai=header.findIndex(h=>/amount|debit|charge|withdraw/.test(h)), mi=header.findIndex(h=>/desc|payee|merchant|name|memo/.test(h));
  const hasHeader=di>-1||ai>-1||mi>-1; const out=[];
  (hasHeader?lines.slice(1):lines).forEach(line=>{ const f=line.split(delim).map(x=>x.replace(/^"|"$/g,'').trim());
    const date=isoDate(f[di>-1?di:0]||todayStr()), merch=(f[mi>-1?mi:1]||'').slice(0,48);
    let amt=Math.abs(parseFloat((f[ai>-1?ai:2]||'').replace(/[$,()]/g,''))||0);
    if(!merch||!amt) return; const cat=categorize(merch);
    out.push({date,merchant:merch,amount:amt,category:cat?cat.c:null,type:cat?cat.t:'per',deductible:cat?cat.ded:0}); });
  return out;
}
VIEWS.import=(v)=>{
  let h=`<div class="section-title">Import CSV</div>`+
    `<p style="font-size:12px;color:var(--ink-2);text-align:center;margin-bottom:14px;line-height:1.6">Export a CSV from any bank or card and drop it here. Parsing runs locally — nothing is uploaded.</p>`+
    `<div class="imp-drop" id="imp-drop" tabindex="0" role="button"><div class="ic">↓</div><div class="it">Drop CSV here</div><div class="is">or tap to choose a file</div><input type="file" id="imp-file" accept=".csv,text/csv" hidden></div>`;
  if(lastImport&&!impRows.length){
    h+=`<div class="li tot"><span class="k">LAST IMPORT</span><span class="dots"></span><span class="v">${lastImport.added} ADDED · ${lastImport.skipped} SKIPPED</span></div>`+
       `<div class="foot-note">YOUR LEDGER NOW HAS ${lastImport.total} TRANSACTIONS · VIEW THEM ALL IN EXPLORE</div>`; }
  if(impRows.length){ const catd=impRows.filter(r=>r.category).length;
    h+=`<div class="imp-summary"><div><div class="l">Rows</div><div class="n">${impRows.length}</div></div>`+
      `<div><div class="l">Categorized</div><div class="n">${Math.round(catd/impRows.length*100)}%</div></div>`+
      `<div><div class="l">Total</div><div class="n">${money0(impRows.reduce((s,r)=>s+r.amount,0))}</div></div></div>`;
    h+=impRows.slice(0,12).map(r=>`<div class="li"><span class="k">${esc(r.merchant)} <small>${esc(r.date)}</small></span><span class="dots"></span><span class="v">${money(r.amount)} ${r.category?`<span class="tag k">${esc(r.category)}</span>`:'<span class="tag">REVIEW</span>'}</span></div>`).join('');
    h+=`<button class="add no-print" id="imp-commit">▸ Add ${impRows.length} to Ledger</button>`; }
  v.innerHTML=h;
  const input=$('#imp-file'), drop=$('#imp-drop');
  drop.addEventListener('click',()=>input.click());
  drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); input.click(); }});
  const handle=file=>{ const r=new FileReader(); r.onload=e=>{ impRows=parseCSV(e.target.result); renderActive(); }; r.readAsText(file); };
  input.addEventListener('change',e=>{ if(e.target.files[0]) handle(e.target.files[0]); });
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
  const c=$('#imp-commit'); if(c) c.addEventListener('click',async()=>{
    // Only skip rows that already exist in the vault; allow duplicate-looking
    // rows WITHIN one import (e.g. two identical coffees on the same day).
    const existing=new Set(coll('transactions').map(t=>t.date+'|'+t.merchant+'|'+t.amount));
    let added=0, skipped=0;
    impRows.forEach(r=>{ const k=r.date+'|'+r.merchant+'|'+r.amount;
      if(existing.has(k)){ skipped++; return; }
      VAULT.transactions.push({id:uid(),date:r.date,merchant:r.merchant,amount:r.amount,direction:'out',category:r.category,account:'Imported',type:r.type,deductible:r.deductible?1:0});
      added++; });
    lastImport={added,skipped,total:coll('transactions').length};
    impRows=[]; await persist();
  });
};

let rvAuto=null; // summary of the last auto-categorize run {total, by:{cat:n}}
VIEWS.review=(v)=>{

  let h=`<div class="section-title">Reconcile · Categorize</div>`;

  }
  if(!q.length){ h+=`<div class="rv-done"><div class="ck">✓</div><div class="dt">All caught up.</div><div class="ds">${cleared} cleared. Every transaction is categorized.</div></div>`; v.innerHTML=h;
    const dx0=$('#rv-recap-x'); if(dx0) dx0.addEventListener('click',()=>{ rvAuto=null; renderActive(); }); return; }
  // how many of the queue the rules can auto-assign right now
  const autoN=q.filter(t=>categorize(t.merchant)).length;
  if(autoN) h+=`<button class="add no-print" id="rv-auto">⚡ Auto-Categorize ${autoN} of ${q.length}</button>`;
  const x=q[0], g=categorize(x.merchant)||{}, guess=g.c||'Other';
  const cats=[guess,...CATS.filter(c=>c!==guess&&c!=='Income')];
  h+=`<div class="rv-q"><div class="qh"><span class="qm">${esc(x.merchant)}<small>${fmtDate(x.date)}${g.t==='biz'?' · likely business':''}</small></span><span class="qa">${money(num(x.amount))}</span></div>`+
    `<div class="rv-cats">${cats.map((c,i)=>`<button data-c="${esc(c)}">${i===0?'✓ ':''}${esc(c)}</button>`).join('')}</div></div>`;
  h+=`<div class="foot-note">${q.length} TO REVIEW · ${cleared} CLEARED · TAP A ROW IN EXPLORE TO FIX DETAILS</div>`;
  v.innerHTML=h;
  const dx=$('#rv-recap-x'); if(dx) dx.addEventListener('click',()=>{ rvAuto=null; renderActive(); });
  $$('.rv-cats button').forEach(b=>b.addEventListener('click',async()=>{
    rvAuto=null; // a manual pick supersedes the auto recap
    x.category=b.dataset.c;
    settings().merchantRules[(x.merchant||'').toLowerCase()]={c:x.category,t:x.type||'per',ded:x.deductible?1:0};
    settings().reviewCleared=(settings().reviewCleared||0)+1;
    await persist();
  }));
  const auto=$('#rv-auto'); if(auto) auto.addEventListener('click',async()=>{
    const by={}; let n=0;
    uncategorized().forEach(t=>{ const m=categorize(t.merchant); if(m){ t.category=m.c; if(m.t)t.type=m.t; t.deductible=m.ded?1:0; by[m.c]=(by[m.c]||0)+1; n++; } });
    rvAuto={total:n, by};
    settings().reviewCleared=(settings().reviewCleared||0)+n;
    await persist();
  });
};

  if(!keys.length){ v.innerHTML=h+empty('No transactions yet — add some in Register'); return; }
  h+=keys.map(k=>{ const m=months[k]; const lbl=new Date(k+'-01').toLocaleDateString('en-US',{month:'short',year:'2-digit'}); return `<div class="li"><span class="k">${lbl}</span><span class="dots"></span><span class="v">${money0(m.inc-m.exp)} <small class="muted">${money0(m.inc)} / ${money0(m.exp)}</small></span></div>`; }).join('');
  const tm=thisMonth();
  const inCats=catTotals(t=>t.direction==='in'&&ym(t.date)===tm), outCats=catTotals(t=>t.direction!=='in'&&ym(t.date)===tm);

  h+=`<div class="li tot"><span class="k">NET THIS MONTH</span><span class="dots"></span><span class="v">${money0(f.net)}</span></div>`;
  if(f.inc>0) h+=`<div class="foot-note">SAVINGS RATE ${Math.round(f.net/f.inc*100)}%</div>`;

};

  let h=`<div class="section-title">Family</div>`;
  if(!fa.length&&!fg.length){ v.innerHTML=h+empty('Flag an account or goal as "Family" to group it here'); return; }
  if(fa.length){ h+=`<div class="section-title">Accounts</div>`+fa.map(a=>row(a,'accounts',a.name,a.type,money0(num(a.balance)))).join(''); }
  if(fg.length){ h+=`<div class="section-title">Goals</div>`+fg.map(g=>row(g,'goals',g.name,money0(num(g.current))+' / '+money0(num(g.target)),num(g.target)?Math.round(num(g.current)/num(g.target)*100)+'%':'')).join(''); }
  v.innerHTML=h;
};

/* ---- Travel ---- */
VIEWS.travel=(v)=>{
  const trips=coll('transactions').filter(t=>t.category==='Travel');
  const mi=coll('mileage'), miTotal=mi.reduce((s,m)=>s+num(m.miles),0), miDed=mi.reduce((s,m)=>s+num(m.miles)*num(m.rate),0);
  let h=`<div class="section-title">Mileage &amp; Travel</div>`;
  h+=`<div class="split"><div><div class="l">Travel Spend</div><div class="n">${money0(trips.reduce((s,t)=>s+num(t.amount),0))}</div></div><div><div class="l">Miles</div><div class="n">${Math.round(miTotal)}</div></div><div><div class="l">Mi. Deduction</div><div class="n">${money0(miDed)}</div></div></div>`;
  h+=`<div class="section-title">Mileage Log</div>`;
  h+= mi.length ? mi.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(m=>row(m,'mileage',(m.purpose||'Trip'),fmtDate(m.date)+' · '+num(m.miles)+' mi',money0(num(m.miles)*num(m.rate)))).join('') : empty('No trips logged');
  h+=addBtn('mileage','Log Trip');
  if(trips.length){ h+=`<div class="section-title">Travel Transactions</div>`+trips.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>row(t,'transactions',t.merchant,fmtDate(t.date),money(num(t.amount)))).join(''); }
  v.innerHTML=h;
};

/* ---- Settings ---- */
VIEWS.settings=(v)=>{
  const sec=settings().webauthn&&settings().webauthn.credentialId;
  let h=`<div class="section-title">Profile</div>`+
   `<div class="reg-form no-print"><div class="fld"><label>Name</label><input id="pf-name" type="text" value="${esc((settings().profile&&settings().profile.name)||'')}" placeholder="Account name"></div><button class="add" id="pf-save">▸ Save Profile</button></div>`;
  h+=`<div class="section-title">Accounts</div>`+(coll('accounts').length?coll('accounts').map(a=>row(a,'accounts',a.name,a.type,money0(num(a.balance)),isLiab(a)?'neg':'')).join(''):empty('No accounts'))+addBtn('accounts','Add Account');
  h+=`<hr class="rule dash"><div class="section-title">Backup</div>`+
   `<button class="add no-print" id="set-export">▸ Export Encrypted Vault</button>`+
   `<div class="imp-drop" id="set-import-drop" tabindex="0" role="button" style="margin-top:10px"><div class="ic">↑</div><div class="it">Import .ledger backup</div><div class="is">restores an encrypted vault · re-unlock after</div><input type="file" id="set-import-file" accept=".ledger,application/json" hidden></div>`+
   `<div class="foot-note" id="set-note" hidden></div>`;
  h+=`<hr class="rule dash"><div class="section-title">Security</div>`+
   `<div class="li"><span class="k">Hardware Key</span><span class="dots"></span><span class="v">${sec?'On':'Off'}</span></div>`+
   `<button class="add no-print" id="sec-toggle" data-on="${sec?'1':''}">▸ ${sec?'Remove':'Enable'} Security Key</button>`;
  h+=`<hr class="rule dash"><div class="section-title">Verify</div><button class="add no-print" id="set-selftest">▸ Run Self-Test</button><div id="selftest-out" style="margin-top:8px"></div>`;
  h+=`<hr class="rule dash"><div class="section-title">Data</div>`+
   `<button class="add no-print" id="set-clear">▸ Clear All Transactions</button>`+
   `<button class="add ghost no-print" id="set-erase" style="margin-top:8px">▸ Erase Vault & Start Over</button>`+
   `<div class="foot-note">END-TO-END ENCRYPTED · CIPHERTEXT ONLY · NO PASSWORD RESET</div>`;
  v.innerHTML=h;

  $('#pf-save').addEventListener('click',async()=>{ settings().profile={...settings().profile,name:$('#pf-name').value.trim()}; await persist(); });
  $('#set-export').addEventListener('click',exportVault);
  const note=m=>{ const n=$('#set-note'); n.hidden=false; n.textContent=m; };
  const idrop=$('#set-import-drop'), ifile=$('#set-import-file');
  idrop.addEventListener('click',()=>ifile.click());
  ifile.addEventListener('change',e=>{ if(e.target.files[0]) importVaultFile(e.target.files[0],note); });
  $('#sec-toggle').addEventListener('click',e=>{ e.currentTarget.dataset.on?disableSecurityKey():enableSecurityKey(); });
  $('#set-selftest').addEventListener('click',runAndShowSelfTest);
  $('#set-clear').addEventListener('click',async()=>{ if(!confirm('Clear ALL transactions? Accounts and settings stay. Export a backup first if you want one — there is no undo.'))return; VAULT.transactions=[]; settings().reviewCleared=0; await persist(); });
  $('#set-erase').addEventListener('click',async()=>{ if(!confirm('Erase the ENTIRE vault — transactions, accounts, AND passphrase?'))return; if(!confirm('Absolutely sure? Without a .ledger backup this is gone for good.'))return; await idbSet('salt',null); await idbSet('data',null); VAULT_KEY=null; VAULT=null; location.reload(); });
};

/* ---- Settings: backup / security / self-test ---- */
async function exportVault(){
  const salt=await idbGet('salt'), data=await idbGet('data'); const n=$('#set-note');
  if(!salt||!data){ if(n){n.hidden=false;n.textContent='NOTHING TO EXPORT YET.';} return; }
  const url=URL.createObjectURL(new Blob([JSON.stringify({app:'LEDGER',fmt:1,salt,data,exportedAt:new Date().toISOString()})],{type:'application/octet-stream'}));
  const a=document.createElement('a'); a.href=url; a.download='ledger-'+todayStr()+'.ledger'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  if(n){ n.hidden=false; n.textContent='EXPORTED · CIPHERTEXT ONLY · STORE IT SAFELY.'; }
}
function importVaultFile(file,note){
  const r=new FileReader();
  r.onload=async e=>{ let o; try{ o=JSON.parse(e.target.result); }catch(_){ return note('NOT A VALID .ledger FILE.'); }
    if(!o||o.app!=='LEDGER'||!o.salt||!o.data) return note('NOT A VALID LEDGER BACKUP.');
    if(!confirm('Replace this device’s vault with the imported backup? You will unlock it with ITS passphrase.')) return;
    await idbSet('salt',o.salt); await idbSet('data',o.data); lockVault();
    $('#lk-msg').textContent='Vault imported — enter its passphrase to unlock.'; };
  r.onerror=()=>note('COULD NOT READ THE FILE.'); r.readAsText(file);
}
async function enableSecurityKey(){
  const note=$('#set-note'); const show=m=>{ if(note){note.hidden=false;note.textContent=m;} };
  if(!window.PublicKeyCredential) return show('THIS DEVICE DOES NOT SUPPORT SECURITY KEYS.');
  try{ const cred=await LedgerCrypto.registerSecurityKey('ledger-'+(VAULT.createdAt||Date.now()),'LEDGER Vault');
    if(!cred||!cred.rawId) return show('NO CREDENTIAL RETURNED.');
    settings().webauthn={credentialId:LedgerCrypto.b64.enc(cred.rawId)}; await persist();
  }catch(e){ show('CANCELLED OR UNSUPPORTED.'); }
}
async function disableSecurityKey(){
  if(!confirm('Remove the security-key requirement? The vault will unlock with just your passphrase.')) return;
  delete settings().webauthn; await persist();
}
async function runSelfTest(){
  const out=[]; const add=(n,ok,d)=>out.push({n,ok,d});
  if(!VAULT||!VAULT_KEY){ add('Vault unlocked',false,'unlock first'); return out; }
  const salt=await idbGet('salt'), blob=await idbGet('data');
  if(!blob){ add('Ciphertext on disk',false,'no data record'); return out; }
  try{ const wrong=await LedgerCrypto.deriveKey('not-the-passphrase-'+Math.random(), LedgerCrypto.b64.dec(salt));
    let threw=false; try{ await LedgerCrypto.decrypt(blob,wrong); }catch(_){ threw=true; }
    add('Wrong passphrase rejected',threw,threw?'GCM auth failed as expected':'decrypt unexpectedly worked'); }
  catch(e){ add('Wrong passphrase rejected',false,String(e)); }
  try{ const disk=await LedgerCrypto.decrypt(blob,VAULT_KEY);
    add('Persisted data reloads',Array.isArray(disk.transactions)&&disk.transactions.length===coll('transactions').length,'on-disk '+(disk.transactions||[]).length+' txns'); }
  catch(e){ add('Persisted data reloads',false,String(e)); }
  try{ const raw=JSON.stringify(blob), s=(coll('transactions').find(t=>t.merchant)||{}).merchant||'';
    const leak=s&&raw.indexOf(s)>-1; add('IndexedDB ciphertext only',!!(blob.ct&&blob.iv)&&!leak,leak?'PLAINTEXT LEAK':'opaque {iv,ct}'); }
  catch(e){ add('IndexedDB ciphertext only',false,String(e)); }
  return out;
}
async function runAndShowSelfTest(){
  const el=$('#selftest-out'); el.innerHTML='<div class="foot-note">Running…</div>';
  const r=await runSelfTest(), pass=r.filter(x=>x.ok).length;
  console.group('LEDGER self-test'); r.forEach(x=>console.log((x.ok?'✓':'✗')+' '+x.n+' — '+x.d)); console.groupEnd();
  el.innerHTML=r.map(x=>`<div class="li"><span class="k">${x.ok?'✓ ':'✗ '}${esc(x.n)} <small>${esc(x.d)}</small></span><span class="dots"></span><span class="v">${x.ok?'PASS':'FAIL'}</span></div>`).join('')+
    `<div class="li tot"><span class="k">RESULT</span><span class="dots"></span><span class="v">${pass}/${r.length} PASS</span></div>`;
}

/* =====================================================================
   Unlock / lock / boot
   ===================================================================== */
function hydrate(){ renderActive(); }
function enterApp(){ $('#lock').style.display='none'; document.body.classList.remove('locked-body'); $('#lk-pass').value=''; $('#lk-msg').textContent=''; captureSnapshot(); hydrate(); }
function lockVault(){ VAULT_KEY=null; VAULT=null; $('#lock').style.display='flex'; document.body.classList.add('locked-body'); $('#lk-pass').focus(); }
function showRecoveryKey(rk){ setTimeout(()=>alert('VAULT CREATED.\n\nYour one-time recovery key:\n\n'+rk+'\n\nWrite it down and store it OFFLINE. There is no password reset — this is the only other way in.'),300); }
async function unlock(passphrase){
  const msg=$('#lk-msg'); let saltRec=await idbGet('salt'); const firstTime=!saltRec; let salt;
  if(firstTime){ salt=LedgerCrypto.newVaultSalt(); await idbSet('salt',LedgerCrypto.b64.enc(salt)); } else salt=LedgerCrypto.b64.dec(saltRec);
  const key=await LedgerCrypto.deriveKey(passphrase,salt);
  if(firstTime){ VAULT_KEY=key; VAULT=blankVault(); await saveVault(); const rk=LedgerCrypto.generateRecoveryKey(); enterApp(); showRecoveryKey(rk); return; }
  const blob=await idbGet('data'); let data;
  try{ data=blob?await LedgerCrypto.decrypt(blob,key):blankVault(); }
  catch(e){ msg.textContent='Wrong passphrase — try again.'; msg.className='lk-msg err'; $('#lk-pass').value=''; return; }
  VAULT=migrateVault(data); VAULT_KEY=key;
  await saveVault();          // persist any migration/date repairs
  const wa=settings().webauthn;
  if(wa&&wa.credentialId){ msg.textContent='Touch your security key…';
    try{ await LedgerCrypto.assertSecurityKey(LedgerCrypto.b64.dec(wa.credentialId)); }
    catch(e){ lockVault(); msg.textContent='Security key required — unlock cancelled.'; msg.className='lk-msg err'; return; } }
  enterApp();
}

/* boot */
(async function init(){
  const exists=await idbGet('salt');
  if(!exists){ $('#lk-hint').textContent='First run — choose a strong passphrase to create your vault.'; $('#lk-unlock').textContent='Create Vault'; }
  document.body.classList.add('locked-body');
  const go=()=>{ const p=$('#lk-pass').value; if(p.length<8){ $('#lk-msg').textContent='Use at least 8 characters.'; $('#lk-msg').className='lk-msg err'; return; } unlock(p); };
  $('#lk-unlock').addEventListener('click',go);
  $('#lk-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  $('#lockNow').addEventListener('click',lockVault);
})();

/* service worker */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

/* theme toggle */
const themeBtn=$('#themeBtn');
themeBtn.addEventListener('click',()=>{ const dark=document.body.getAttribute('data-theme')==='dark';
  document.body.setAttribute('data-theme',dark?'light':'dark'); themeBtn.textContent=dark?'◐ DARK MODE':'◑ LIGHT MODE'; });

/* tabs */
function switchTab(name){
  const b=$(`#tabs button[data-v="${name}"]`); if(!b) return;
  if(!b.classList.contains('pri')) setTabsExpanded(true); // reveal strip if target is in the More tier
  $$('#tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  activeTab=name; $$('.view').forEach(view=>view.classList.remove('on'));
  $('#v-'+activeTab).classList.add('on'); renderActive(); window.scrollTo({top:0,behavior:'smooth'});
}
$$('#tabs button[data-v]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.v)));
function setTabsExpanded(on){
  $('#tabs').classList.toggle('x',on);
  const m=$('#tabsMore'); m.textContent=on?'× Less':'⋯ More'; m.setAttribute('aria-expanded',on?'true':'false');
}
$('#tabsMore').addEventListener('click',()=>setTabsExpanded(!$('#tabs').classList.contains('x')));

/* swipe left/right anywhere on the receipt to move between adjacent tabs */
(()=>{
  const area=document.querySelector('.receipt'); if(!area) return;
  let x0=0,y0=0,t0=0;
  area.addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); },{passive:true});
  area.addEventListener('touchend',e=>{
    if(e.target.closest('.tabs,input,textarea,select,button,a,[data-edit],[data-add]')) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Date.now()-t0>600||Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6) return;
    // swipe only through currently visible tabs (primary tier when collapsed)
    const order=$$('#tabs button[data-v]').filter(b=>b.offsetParent!==null).map(b=>b.dataset.v);
    const i=order.indexOf(activeTab), next=order[i+(dx<0?1:-1)];
    if(next) switchTab(next);
  },{passive:true});
})();

/* global CRUD delegation */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-msave]')) return saveEditor();
  if(e.target.closest('[data-mcancel]')) return closeModal();
  if(e.target.closest('[data-mdel]')) return deleteEditor();
  const add=e.target.closest('[data-add]'); if(add) return openEditor(add.dataset.add);
  const ed=e.target.closest('[data-edit]'); if(ed){ const i=ed.dataset.edit.indexOf(':'); const c=ed.dataset.edit.slice(0,i), id=ed.dataset.edit.slice(i+1); return openEditor(c, coll(c).find(x=>x.id===id)); }
});
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
